name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Lint and core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: swift-format lint --strict --recursive PeekAhead.swiftpm Tests Package.swift
      - name: Unit tests
        run: swift test --parallel

  submission-size:
    name: Submission size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check zipped App Playground size
        run: scripts/check-submission-size.sh
